name: Reset Contract Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install existing bridge dependencies without lifecycle scripts
        run: npm ci --prefix rms-discord-bridge --ignore-scripts --no-audit --no-fund
      - name: Verify requested assistance and signed interaction boundaries
        run: npm --prefix rms-discord-bridge run test:assistance
      - name: Run Reset contract regression
        run: node --test tests/reset-contract.test.mjs
